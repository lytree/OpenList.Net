name: Build bundles (reusable)

# Shared all-platform build, called by BOTH workflows:
#   * ci.yml      — every commit on main: builds everything, uploads Artifacts only,
#                   never touches GitHub Releases.
#   * release.yml — v* tags: same build, then attaches the artifacts to the Release.
#
# The RID matrix lives here on purpose: when it was copy-pasted into both files the
# two drifted apart. One definition, one place to add a platform.
#
# Callers pass the already-resolved version/frontend values in, so this workflow
# never re-runs GitVersion (that job needs `fetch-depth: 0` and a checkout of the
# exact ref — cheaper to do once upstream).
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag or SHA). Empty = the triggering ref.'
        required: false
        type: string
        default: ''
      semver:
        description: 'SemVer, e.g. 1.2.3 or 0.1.0-beta.4'
        required: true
        type: string
      assembly-ver:
        required: true
        type: string
      file-ver:
        required: true
        type: string
      info-ver:
        required: true
        type: string
      sha:
        required: true
        type: string
      retention-days:
        description: 'Artifact retention. Releases need them only until the upload job runs.'
        required: false
        type: number
        default: 7

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release

jobs:
  # The SPA ships from this repo since M5, so it is built here once and handed to every
  # platform job as an artifact. Building it inside each matrix leg would repeat the same
  # pnpm install 14 times and, worse, let one leg quietly bundle a stale dist.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # pnpm is pinned by frontend/package.json → packageManager. Installing it
      # explicitly (instead of corepack) keeps the version identical to local dev.
      - name: Install pnpm
        run: npm i -g pnpm@12.15.0
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # There is no other job that runs the frontend suite — if these skip here,
      # a broken SPA would ship with green .NET tests.
      - name: Typecheck + unit tests
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm test
      - name: Build SPA
        working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Self-contained headless server for 8 runtime identifiers (glibc / musl / Windows / macOS).
  # Bundle name is version-suffixed, e.g. openlist-net-1.2.3-linux-x64.
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: linux-musl-x64
            archive: tar.gz
          - rid: linux-musl-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    # Mirror the inputs into env once so the step scripts (and the README
    # heredoc) read the same names regardless of which workflow called us.
    env:
      SEMVER: ${{ inputs.semver }}
      ASM_VER: ${{ inputs.assembly-ver }}
      FILE_VER: ${{ inputs.file-ver }}
      INFO_VER: ${{ inputs.info-ver }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server (self-contained)
        run: |
          set -euo pipefail
          BUNDLE="openlist-net-${SEMVER}-${{ matrix.rid }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/app" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"
          {
            echo "semver=$SEMVER"
            echo "assemblyVer=$ASM_VER"
            echo "fileVer=$FILE_VER"
            echo "informationalVer=$INFO_VER"
            echo "sha=$SHA"
          } > "$BUNDLE/app/VERSION"

      # Ops CLI — the recovery path for a locked-out admin. Self-contained for the same
      # reason the server is: you can't install a runtime before you can reset the password.
      - name: Publish ops CLI (self-contained)
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Cli/OpenList.Cli.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/cli" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      - name: Download SPA dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: fe-dist

      - name: Stage SPA into bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE/frontend/dist"
          cp -a fe-dist/. "$BUNDLE/frontend/dist/"

      - name: Write launchers and README
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"

          case "$RID" in
            win-*)
              cat > run.bat <<'EOF'
          @echo off
          cd /d "%~dp0app"
          set OpenList__DistDir=../frontend/dist
          OpenList.Server.exe
          EOF
              ;;
            *)
              cat > run.sh <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")/app" || exit 1
          export OpenList__DistDir="../frontend/dist"
          exec ./OpenList.Server
          EOF
              chmod +x run.sh
              ;;
          esac

          cat > README.txt <<EOF
          $BUNDLE
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: built from source in this repo (frontend/)

          Self-contained build — no .NET runtime required on the host.

          Layout:
            app/             .NET server (self-contained publish output)
            cli/             Ops CLI (openlist) — password recovery, storage admin
            frontend/dist/   OpenList SPA (Vue 3, built from this repo)
            run.sh / run.bat Launcher that sets OpenList__DistDir and starts the server
            README.txt       This file

          Run:
            Linux/macOS:  ./run.sh
            Windows:      run.bat

          The launcher exports OpenList__DistDir=../frontend/dist (relative to app/) so the
          server finds the SPA without editing appsettings.json. Default port: http://0.0.0.0:5244

          Lost the admin password? The built-in admin cannot be deleted, renamed or demoted,
          so cli/ is the way back in — it talks to the database directly and works even when
          the server is not running:
            cli/openlist admin info        show the admin username
            cli/openlist admin random      reset to a random password (printed to console)
            cli/openlist admin set PASS    set a specific password

          Data is stored under app/data/ by default. Configure via OpenList__ environment
          variables (e.g. OpenList__Database__Type=postgres).
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
            FILE="$BUNDLE.zip"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
            FILE="$BUNDLE.tar.gz"
          fi
          # Publish a checksum alongside every asset so downloads are verifiable.
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: |
            ${{ env.BUNDLE }}.${{ matrix.archive }}
            ${{ env.BUNDLE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Desktop control app (Avalonia GUI managing the server as a child process).
  # One bundle per GUI-capable RID: desktop exe at the bundle root, server under
  # server/ (probed by OpenListCoreService.ResolveCorePath), frontend/dist alongside
  # (injected as OpenList__DistDir at launch).
  # No musl RIDs — the GUI targets glibc desktops.
  binaries-desktop:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    # Mirror the inputs into env once so the step scripts (and the README
    # heredoc) read the same names regardless of which workflow called us.
    env:
      SEMVER: ${{ inputs.semver }}
      ASM_VER: ${{ inputs.assembly-ver }}
      FILE_VER: ${{ inputs.file-ver }}
      INFO_VER: ${{ inputs.info-ver }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server core (self-contained)
        run: |
          set -euo pipefail
          BUNDLE="openlist-net-desktop-${SEMVER}-${{ matrix.rid }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/server" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      - name: Publish desktop app (self-contained)
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Desktop/OpenList.Desktop.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"
          {
            echo "semver=$SEMVER"
            echo "assemblyVer=$ASM_VER"
            echo "fileVer=$FILE_VER"
            echo "informationalVer=$INFO_VER"
            echo "sha=$SHA"
          } > "$BUNDLE/VERSION"

      # Ops CLI inside the desktop bundle too — the GUI has no password-recovery path
      # of its own, and a locked-out admin must not be stuck. (README advertises
      # cli/ — keep the promise.)
      - name: Publish ops CLI (self-contained)
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Cli/OpenList.Cli.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/cli" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      - name: Download SPA dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: fe-dist

      - name: Stage SPA into bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE/frontend/dist"
          cp -a fe-dist/. "$BUNDLE/frontend/dist/"

      - name: Write README
        run: |
          set -euo pipefail
          cat > "$BUNDLE/README.txt" <<EOF
          $BUNDLE
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: built from source in this repo (frontend/)

          Self-contained build — no .NET runtime required on the host.

          Layout:
            OpenList.Desktop[.exe]  Avalonia desktop control app (start this)
            server/OpenList.Server  Self-contained server (managed child process)
            cli/openlist[.exe]      Ops CLI — password recovery, storage admin
            frontend/dist/          OpenList SPA (Vue 3, built from this repo)
            README.txt              This file

          Run:
            Start OpenList.Desktop (double-click on Windows). The desktop app launches the
            server automatically (port configurable in settings), shows a tray icon and a
            live log viewer. Data is stored under data/ next to the desktop executable.

          The desktop app injects OpenList__DistDir so the server serves frontend/dist on
          the same port as the API. Default port: http://0.0.0.0:5244.

          Note (macOS/Linux): the desktop app is not wrapped in an .app/.desktop bundle —
          run it directly from this directory.
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
            FILE="$BUNDLE.zip"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
            FILE="$BUNDLE.tar.gz"
          fi
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: |
            ${{ env.BUNDLE }}.${{ matrix.archive }}
            ${{ env.BUNDLE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
