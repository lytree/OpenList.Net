name: Build bundles (reusable)

# Shared all-platform build, called by BOTH workflows:
#   * ci.yml      — every commit on main: builds everything, uploads Artifacts only,
#                   never touches GitHub Releases.
#   * release.yml — v* tags: same build, then attaches the artifacts to the Release.
#
# The RID matrix lives here on purpose: when it was copy-pasted into both files the
# two drifted apart. One definition, one place to add a platform.
#
# Callers pass the already-resolved version/frontend values in, so this workflow
# never re-runs GitVersion (that job needs `fetch-depth: 0` and a checkout of the
# exact ref — cheaper to do once upstream).
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag or SHA). Empty = the triggering ref.'
        required: false
        type: string
        default: ''
      semver:
        description: 'SemVer, e.g. 1.2.3 or 0.1.0-beta.4'
        required: true
        type: string
      assembly-ver:
        required: true
        type: string
      file-ver:
        required: true
        type: string
      info-ver:
        required: true
        type: string
      sha:
        required: true
        type: string
      retention-days:
        description: 'Artifact retention. Releases need them only until the upload job runs.'
        required: false
        type: number
        default: 7

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release

jobs:
  # The SPA ships from this repo since M5, so it is built here once and handed to every
  # platform job as an artifact. Building it inside each matrix leg would repeat the same
  # pnpm install 14 times and, worse, let one leg quietly bundle a stale dist.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # pnpm is pinned by frontend/package.json → packageManager. Installing it
      # explicitly (instead of corepack) keeps the version identical to local dev.
      - name: Install pnpm
        run: npm i -g pnpm@12.15.0
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # There is no other job that runs the frontend suite — if these skip here,
      # a broken SPA would ship with green .NET tests.
      - name: Typecheck + unit tests
        working-directory: frontend
        run: |
          pnpm typecheck
          pnpm test
      - name: Build SPA
        working-directory: frontend
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/index.html
            frontend/favicon.svg
            frontend/assets
            frontend/ruffle
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Self-contained headless server for 8 runtime identifiers (glibc / musl / Windows / macOS).
  # Bundle name is version-suffixed, e.g. openlist-net-1.2.3-linux-x64.
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: linux-musl-x64
            archive: tar.gz
          - rid: linux-musl-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    # Mirror the inputs into env once so the step scripts (and the README
    # heredoc) read the same names regardless of which workflow called us.
    env:
      SEMVER: ${{ inputs.semver }}
      ASM_VER: ${{ inputs.assembly-ver }}
      FILE_VER: ${{ inputs.file-ver }}
      INFO_VER: ${{ inputs.info-ver }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # All executables in a bundle are RID-specific *framework-dependent* publishes: they
      # carry an apphost but no runtime. AppHostDotNetSearch/AppHostRelativeDotNet are baked
      # into that apphost so it resolves the shared `host/` + `shared/` layout staged below
      # (one copy for the whole bundle) instead of a machine-wide install. Layout:
      #   app/  + cli/  →  ..
      #
      # PublishSingleFile keeps each folder down to one executable: the managed assemblies and
      # the native libraries go inside the exe (not into the runtime — SelfContained stays
      # false), so app/ holds OpenList.Server + appsettings.json and cli/ holds openlist.
      - name: Publish server
        run: |
          set -uo pipefail
          BUNDLE="openlist-net-${SEMVER}-${{ matrix.rid }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          # 失败时把真正的错误行顶到 step 的 annotation 上：这套 matrix 的 publish 只在
          # Unix runner 上挂过，而 gating 用的账号读不到完整 job 日志，annotation 是唯一
          # 能看到的通道。
          if ! dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/app" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=.. \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA" > /tmp/publish.log 2>&1; then
            echo "----- last 40 lines -----"
            tail -40 /tmp/publish.log
            # 每一条真实错误单独顶一个 annotation（日志下载需要 admin 权限，annotation 不用）
            grep -iE '(: error|error [A-Z]+[0-9]{3,4}|NETSDK[0-9]{4}|MSB[0-9]{4})' /tmp/publish.log \
              | head -6 \
              | while IFS= read -r line; do
                  echo "::error title=publish ${{ matrix.rid }}::${line:0:900}"
                done
            exit 1
          fi
          # content files the exe cannot swallow (and that this bundle does not use)
          rm -f "$BUNDLE/app/appsettings.Development.json" "$BUNDLE/app/web.config"
          {
            echo "semver=$SEMVER"
            echo "assemblyVer=$ASM_VER"
            echo "fileVer=$FILE_VER"
            echo "informationalVer=$INFO_VER"
            echo "sha=$SHA"
          } > "$BUNDLE/app/VERSION"

      # Ops CLI — the recovery path for a locked-out admin. It shares the bundle's runtime
      # for the same reason the server does: you can't install a runtime before you can
      # reset the password.
      - name: Publish ops CLI
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Cli/OpenList.Cli.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/cli" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=.. \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      # The single .NET install layout both of the above point at. Built by the Cake script
      # so the pack→install-layout mapping exists exactly once (see build/build.cs).
      - name: Stage shared .NET runtime root
        run: |
          set -euo pipefail
          dotnet run build/build.cs -- --target=Runtime --rid="${{ matrix.rid }}" --dest="$BUNDLE"

      - name: Download SPA dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: fe-dist

      - name: Stage SPA into bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE/frontend"
          cp -a fe-dist/. "$BUNDLE/frontend/"

      - name: Write launchers and README
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"

          case "$RID" in
            win-*)
              cat > run.bat <<'EOF'
          @echo off
          cd /d "%~dp0app"
          set OpenList__DistDir=../frontend
          if not defined ASPNETCORE_URLS set ASPNETCORE_URLS=http://0.0.0.0:5244
          OpenList.Server.exe
          EOF
              ;;
            *)
              cat > run.sh <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")/app" || exit 1
          export OpenList__DistDir="../frontend"
          : "${ASPNETCORE_URLS:=http://0.0.0.0:5244}"
          export ASPNETCORE_URLS
          exec ./OpenList.Server
          EOF
              chmod +x run.sh
              ;;
          esac

          cat > README.txt <<EOF
          $BUNDLE
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: built from source in this repo (frontend/)

          Self-contained in the sense that matters: the .NET runtime ships as host/ + shared/,
          one copy shared by app/ and cli/. Nothing has to be installed on the host.

          Layout:
            app/             OpenList.Server (single exe) + appsettings.json + VERSION
            cli/             openlist (single exe) — password recovery, storage admin
            host/            Shared .NET runtime (hostfxr) — used by app/ and cli/
            shared/          Shared .NET runtime (frameworks) — used by app/ and cli/
            frontend/        OpenList SPA (Vue 3, built from this repo)
            run.sh / run.bat Launcher that sets OpenList__DistDir and starts the server
            README.txt       This file

          Run:
            Linux/macOS:  ./run.sh
            Windows:      run.bat

          The executables find host/ + shared/ through a relative path embedded in their
          apphost (AppHostRelativeDotNet), so nothing has to be installed on the host — but
          those folders must stay next to app/. Moving app/ on its own will make it fail to start.

          The launcher exports OpenList__DistDir=../frontend (relative to app/) so the
          server finds the SPA without editing appsettings.json. Default port: http://0.0.0.0:5244

          Lost the admin password? The built-in admin cannot be deleted, renamed or demoted,
          so cli/ is the way back in — it talks to the database directly and works even when
          the server is not running:
            cli/openlist admin info        show the admin username
            cli/openlist admin random      reset to a random password (printed to console)
            cli/openlist admin set PASS    set a specific password

          Data is stored under app/data/ by default. Configure via OpenList__ environment
          variables (e.g. OpenList__Database__Type=postgres).
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
            FILE="$BUNDLE.zip"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
            FILE="$BUNDLE.tar.gz"
          fi
          # Publish a checksum alongside every asset so downloads are verifiable.
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: |
            ${{ env.BUNDLE }}.${{ matrix.archive }}
            ${{ env.BUNDLE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Desktop control app (Avalonia GUI managing the server as a child process).
  # One bundle per GUI-capable RID: desktop exe, server exe and the ops CLI all at the
  # bundle root (ResolveCorePath probes <base>/OpenList.Server[.exe], so no sub-folder),
  # one shared host/ + shared/ runtime next to them, frontend/ alongside (injected as
  # OpenList__DistDir at launch).
  # No musl RIDs — the GUI targets glibc desktops.
  binaries-desktop:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    # Mirror the inputs into env once so the step scripts (and the README
    # heredoc) read the same names regardless of which workflow called us.
    env:
      SEMVER: ${{ inputs.semver }}
      ASM_VER: ${{ inputs.assembly-ver }}
      FILE_VER: ${{ inputs.file-ver }}
      INFO_VER: ${{ inputs.info-ver }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Every executable here is a RID-specific framework-dependent *single-file* publish: the
      # managed assemblies ride inside the exe, the .NET runtime is the shared host/ + shared/
      # layout staged by --target=Runtime below (no `framework/` wrapper folder).
      # Publish into .stage/ first — `dotnet publish` also drops appsettings.json / web.config,
      # and the bundle root is supposed to end up with nothing but the three exes.
      # All three apphosts embed AppHostRelativeDotNet=. (host/ and shared/ are right there).
      - name: Publish server core
        run: |
          set -euo pipefail
          BUNDLE="openlist-net-desktop-${SEMVER}-${{ matrix.rid }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/.stage/server" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=. \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"
          rm -f "$BUNDLE/.stage/server/appsettings.Development.json" "$BUNDLE/.stage/server/web.config"

      - name: Publish desktop app
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Desktop/OpenList.Desktop.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/.stage/desktop" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=. \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      # Ops CLI inside the desktop bundle too — the GUI has no password-recovery path
      # of its own, and a locked-out admin must not be stuck. (README advertises it —
      # keep the promise.)
      - name: Publish ops CLI
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Cli/OpenList.Cli.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/.stage/cli" \
            -r "${{ matrix.rid }}" \
            -p:SelfContained=false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:AppHostDotNetSearch=AppRelative \
            -p:AppHostRelativeDotNet=. \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      # Bundle root = the three exes, nothing else. Settings go to config/, the runtime and the
      # SPA are staged by the steps below into host/ + shared/ and frontend/.
      - name: Assemble bundle root
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"
          suffix=""
          case "$RID" in win-*) suffix=".exe" ;; esac
          mv ".stage/server/OpenList.Server${suffix}" .
          mv ".stage/desktop/OpenList.Desktop${suffix}" .
          mv ".stage/cli/openlist${suffix}" .
          mkdir -p config
          mv .stage/server/appsettings.json config/
          rm -rf .stage

      # One runtime for all three executables (desktop + server + cli).
      - name: Stage shared .NET runtime root
        run: |
          set -euo pipefail
          dotnet run build/build.cs -- --target=Runtime --rid="${{ matrix.rid }}" --dest="$BUNDLE"

      - name: Download SPA dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: fe-dist

      - name: Stage SPA into bundle
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE/frontend"
          cp -a fe-dist/. "$BUNDLE/frontend/"

      - name: Write README
        run: |
          set -euo pipefail
          cat > "$BUNDLE/README.txt" <<EOF
          $BUNDLE
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: built from source in this repo (frontend/)

          Framework-dependent build: the .NET runtime ships as host/ + shared/, one copy shared
          by all three executables. No runtime has to be installed on the host.

          Layout — the three executables live in the bundle root:
            OpenList.Desktop[.exe]  Avalonia desktop control app (start this)
            OpenList.Server[.exe]   Server core (managed child process)
            openlist[.exe]          Ops CLI — password recovery, storage admin

          Directories:
            host/                   Shared .NET runtime (hostfxr) — used by all three exes
            shared/                 Shared .NET runtime (frameworks) — used by all three exes
            frontend/               OpenList SPA (Vue 3, built from this repo)
            config/                 Editable settings (appsettings.json)

          The three executables are single-file: the assemblies they need are inside each exe,
          nothing else has to sit beside them. The runtime is the shared copy in host/ + shared/,
          found through AppHostRelativeDotNet — copy a bare exe elsewhere and it will not run.

          Run:
            Start OpenList.Desktop (double-click on Windows). The desktop app launches the
            server automatically (port configurable in settings), shows a tray icon and a
            live log viewer. Data is stored under data/ by default.

          The desktop app injects OpenList__DistDir so the server serves frontend/ on
          the same port as the API. Default port: http://0.0.0.0:5244.

          Note (macOS/Linux): the desktop app is not wrapped in an .app/.desktop bundle —
          run it directly from this directory.
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
            FILE="$BUNDLE.zip"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
            FILE="$BUNDLE.tar.gz"
          fi
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: |
            ${{ env.BUNDLE }}.${{ matrix.archive }}
            ${{ env.BUNDLE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
