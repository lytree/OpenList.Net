name: CI

# Every commit on main is built for ALL platforms (8 self-contained server bundles
# + 6 desktop bundles + the lightweight framework-dependent bundle) and kept as
# downloadable Actions Artifacts. CI never publishes to GitHub Releases — that
# only happens in release.yml when a v* tag is pushed.
#
# The platform matrix itself lives in build-bundles.yml (a reusable workflow) so
# ci.yml and release.yml cannot drift apart.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same ref supersedes the previous run.
# PRs cancel each other aggressively to save runner minutes; main does NOT
# cancel, so every commit on main keeps its own set of build artifacts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  BUNDLE_NAME: openlist-net-framework-dependent

jobs:
  # Compute the semantic version once so build / bundle / docker all agree.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semver }}
      fullSemVer: ${{ steps.gv.outputs.fullSemVer }}
      assemblyVer: ${{ steps.gv.outputs.assemblyVer }}
      fileVer: ${{ steps.gv.outputs.fileVer }}
      infoVer: ${{ steps.gv.outputs.infoVer }}
      sha: ${{ steps.gv.outputs.sha }}
      shortSha: ${{ steps.gv.outputs.shortSha }}
    steps:
      # fetch-depth: 0 is REQUIRED — GitVersion needs tags + full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gv
        uses: ./.github/actions/resolve-version

  # Resolve the latest non-lite frontend release tag from the upstream repo once,
  # so every downstream job bundles the same frontend version.
  resolve-frontend:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo OpenListTeam/OpenList-Frontend --json tagName -q .tagName)"
          echo "Resolved frontend tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-test:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenList.slnx

      - name: Build
        run: |
          dotnet build OpenList.slnx -c "$CONFIGURATION" --no-restore \
            -p:Version="${{ needs.resolve-version.outputs.semver }}" \
            -p:AssemblyVersion="${{ needs.resolve-version.outputs.assemblyVer }}" \
            -p:FileVersion="${{ needs.resolve-version.outputs.fileVer }}" \
            -p:InformationalVersion="${{ needs.resolve-version.outputs.infoVer }}" \
            -p:SourceRevisionId="${{ needs.resolve-version.outputs.sha }}"

      - name: Test
        # MTP mode (opt-in via global.json) — `--logger` is a VSTest option and is
        # rejected here; TRX output comes from `--report-trx` instead.
        run: dotnet test --solution OpenList.slnx -c "$CONFIGURATION" --no-build --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  # All-platform build (server: linux-x64/arm64, linux-musl-x64/arm64, win-x64/arm64,
  # osx-x64/arm64 — plus desktop bundles for the 6 GUI-capable RIDs).
  # Artifacts only; nothing is published to Releases here.
  # Skipped on pull_request — PRs only need to prove build + test pass.
  bundles:
    if: github.event_name != 'pull_request'
    needs: [resolve-frontend, resolve-version, build-test]
    uses: ./.github/workflows/build-bundles.yml
    with:
      ref: ${{ github.ref }}
      frontend-tag: ${{ needs.resolve-frontend.outputs.tag }}
      semver: ${{ needs.resolve-version.outputs.semver }}
      assembly-ver: ${{ needs.resolve-version.outputs.assemblyVer }}
      file-ver: ${{ needs.resolve-version.outputs.fileVer }}
      info-ver: ${{ needs.resolve-version.outputs.infoVer }}
      sha: ${{ needs.resolve-version.outputs.sha }}
      # 14 days: main-branch artifacts are for testers, not for shipping.
      retention-days: 14

  # Framework-dependent bundle: app/ + frontend/dist/ + launchers + README,
  # packaged as tar.gz and kept as a downloadable CI artifact. Small and
  # platform-agnostic — the self-contained bundles above cost ~1 GB in total,
  # this one is a few MB when you already have the .NET 10 runtime.
  # Skipped on pull_request — PRs only need to prove build + test pass.
  bundle:
    if: github.event_name != 'pull_request'
    needs: [resolve-frontend, resolve-version, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Directory + archive are version-suffixed, e.g.
      # openlist-net-framework-dependent-0.1.0-42
      - name: Download upstream frontend dist (non-lite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
          SEMVER: ${{ needs.resolve-version.outputs.semver }}
        run: |
          set -euo pipefail
          BUNDLE="${BUNDLE_NAME}-${SEMVER}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          mkdir -p fe "$BUNDLE/frontend/dist"
          # Exact tag-qualified asset name avoids matching the -lite- variant.
          gh release download "$FE_TAG" --repo OpenListTeam/OpenList-Frontend \
            --pattern "openlist-frontend-dist-${FE_TAG}.tar.gz" --dir fe
          tar -xzf "fe/openlist-frontend-dist-${FE_TAG}.tar.gz" -C "$BUNDLE/frontend/dist"
          printf '%s' "$FE_TAG" > "$BUNDLE/frontend/dist/VERSION"

      - name: Publish server (framework-dependent)
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/app" \
            -p:UseAppHost=false \
            -p:SelfContained=false \
            -p:Version="${{ needs.resolve-version.outputs.semver }}" \
            -p:AssemblyVersion="${{ needs.resolve-version.outputs.assemblyVer }}" \
            -p:FileVersion="${{ needs.resolve-version.outputs.fileVer }}" \
            -p:InformationalVersion="${{ needs.resolve-version.outputs.infoVer }}" \
            -p:SourceRevisionId="${{ needs.resolve-version.outputs.sha }}"
          # VERSION file lets the running server surface build metadata.
          {
            echo "semver=${{ needs.resolve-version.outputs.semver }}"
            echo "fullSemVer=${{ needs.resolve-version.outputs.fullSemVer }}"
            echo "assemblyVer=${{ needs.resolve-version.outputs.assemblyVer }}"
            echo "fileVer=${{ needs.resolve-version.outputs.fileVer }}"
            echo "informationalVer=${{ needs.resolve-version.outputs.infoVer }}"
            echo "sha=${{ needs.resolve-version.outputs.sha }}"
          } > "$BUNDLE/app/VERSION"

      - name: Write launchers and README
        env:
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
          SEMVER: ${{ needs.resolve-version.outputs.semver }}
          SHA: ${{ needs.resolve-version.outputs.sha }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"

          cat > run.sh <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")/app" || exit 1
          export OpenList__DistDir="../frontend/dist"
          exec dotnet OpenList.Server.dll
          EOF
          chmod +x run.sh

          cat > run.bat <<'EOF'
          @echo off
          cd /d "%~dp0app"
          set OpenList__DistDir=../frontend/dist
          dotnet OpenList.Server.dll
          EOF

          cat > README.txt <<EOF
          $BUNDLE
          ================================

          Build: $SEMVER (sha $SHA)
          Frontend: $FE_TAG

          Layout:
            app/             .NET server (framework-dependent publish output; needs the .NET 10 runtime)
            frontend/dist/   OpenList SPA (pre-built, upstream non-lite release)
            run.sh / run.bat Launcher that sets OpenList__DistDir and starts the server
            README.txt       This file

          Run:
            Linux/macOS:  ./run.sh
            Windows:      run.bat

          Requires the .NET 10 runtime on the host. The launcher exports
          OpenList__DistDir=../frontend/dist (relative to app/) so the server finds the SPA
          without editing appsettings.json. Default port: http://0.0.0.0:5244

          Data is stored under app/data/ by default. Configure via OpenList__ environment
          variables (e.g. OpenList__Database__Type=postgres).
          EOF

      - name: Package bundle
        run: tar -czf "$BUNDLE.tar.gz" "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Every main-branch commit is published to GHCR so testers can pull an
  # "edge" image without waiting for a release. `:latest` is intentionally
  # reserved for release.yml so it always means "newest formal release".
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [resolve-frontend, resolve-version, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openlist-net" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            FRONTEND_VERSION=${{ needs.resolve-frontend.outputs.tag }}
            VERSION=${{ needs.resolve-version.outputs.semver }}
            ASSEMBLY_VERSION=${{ needs.resolve-version.outputs.assemblyVer }}
            FILE_VERSION=${{ needs.resolve-version.outputs.fileVer }}
            INFORMATIONAL_VERSION=${{ needs.resolve-version.outputs.infoVer }}
            SOURCE_REVISION_ID=${{ needs.resolve-version.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ needs.resolve-version.outputs.semver }}
            ${{ env.IMAGE }}:sha-${{ needs.resolve-version.outputs.shortSha }}
          # Dedicated cache scope so ci.yml and release.yml don't evict each
          # other's layers (both use the shared gha backend).
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max
