name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag / release version (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CONFIGURATION: Release

jobs:
  resolve-frontend:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo OpenListTeam/OpenList-Frontend --json tagName -q .tagName)"
          echo "Resolved frontend tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Compute the semantic version once via GitVersion so binaries/docker/release all agree.
  # On a v* tag push, GitVersion produces the clean tag version (e.g. v1.2.3 -> 1.2.3).
  # Requires full Git history (fetch-depth: 0) for accurate version calculation.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semver }}
      fullSemVer: ${{ steps.gv.outputs.fullSemVer }}
      assemblyVer: ${{ steps.gv.outputs.assemblyVer }}
      fileVer: ${{ steps.gv.outputs.fileVer }}
      infoVer: ${{ steps.gv.outputs.infoVer }}
      sha: ${{ steps.gv.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - id: gv
        run: |
          set -euo pipefail
          JSON="$(dotnet gitversion -output json -nocache)"
          pick() { printf '%s' "$JSON" | jq -r "$1 // empty" 2>/dev/null || printf '%s' "$JSON" | sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\).*/\1/p"; }
          SEM="$(pick '.SemVer')"
          FULL="$(pick '.FullSemVer')"
          ASM="$(pick '.AssemblySemVer')"
          FILE="$(pick '.AssemblySemFileVer')"
          INFO="$(pick '.InformationalVersion')"
          SHA="$(pick '.Sha')"
          if [ -z "$ASM" ]; then
            BASE="${SEM%%-*}"; BASE="${BASE%%+*}"
            IFS='.' read -r MA MI PA _ <<<"$BASE"
            ASM="${MA:-0}.${MI:-0}.${PA:-0}.0"
          fi
          [ -z "$FILE" ] && FILE="$ASM"
          [ -z "$INFO" ] && INFO="${FULL:-$SEM}"
          {
            echo "semver=$SEM"
            echo "fullSemVer=$FULL"
            echo "assemblyVer=$ASM"
            echo "fileVer=$FILE"
            echo "infoVer=$INFO"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $SEM (assembly=$ASM, sha=$SHA)"

  # Self-contained single-file binaries for 8 runtime identifiers.
  # Bundle directory + archive name are version-suffixed (e.g. openlist-net-1.2.3-linux-x64).
  binaries:
    needs: [resolve-frontend, resolve-version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: linux-musl-x64
            archive: tar.gz
          - rid: linux-musl-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    env:
      SEMVER: ${{ needs.resolve-version.outputs.semver }}
      ASM_VER: ${{ needs.resolve-version.outputs.assemblyVer }}
      FILE_VER: ${{ needs.resolve-version.outputs.fileVer }}
      INFO_VER: ${{ needs.resolve-version.outputs.infoVer }}
      SHA: ${{ needs.resolve-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server (self-contained single-file)
        run: |
          BUNDLE="openlist-net-${SEMVER}-${{ matrix.rid }}"
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/app" \
            -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"
          {
            echo "semver=$SEMVER"
            echo "assemblyVer=$ASM_VER"
            echo "fileVer=$FILE_VER"
            echo "informationalVer=$INFO_VER"
            echo "sha=$SHA"
          } > "$BUNDLE/app/VERSION"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Download upstream frontend dist (non-lite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p fe "$BUNDLE/frontend/dist"
          gh release download "$FE_TAG" --repo OpenListTeam/OpenList-Frontend \
            --pattern "openlist-frontend-dist-${FE_TAG}.tar.gz" --dir fe
          tar -xzf "fe/openlist-frontend-dist-${FE_TAG}.tar.gz" -C "$BUNDLE/frontend/dist"
          printf '%s' "$FE_TAG" > "$BUNDLE/frontend/dist/VERSION"

      - name: Write launchers and README
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"

          case "$RID" in
            win-*)
              cat > run.bat <<'EOF'
          @echo off
          cd /d "%~dp0app"
          set OpenList__DistDir=../frontend/dist
          OpenList.Server.exe
          EOF
              ;;
            *)
              cat > run.sh <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")/app" || exit 1
          export OpenList__DistDir="../frontend/dist"
          exec ./OpenList.Server
          EOF
              chmod +x run.sh
              ;;
          esac

          cat > README.txt <<EOF
          $BUNDLE
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: ${{ needs.resolve-frontend.outputs.tag }}

          Self-contained single-file build — no .NET runtime required on the host.

          Layout:
            app/             .NET server (self-contained single-file executable)
            frontend/dist/   OpenList SPA (pre-built, upstream non-lite release)
            run.sh / run.bat Launcher that sets OpenList__DistDir and starts the server
            README.txt       This file

          Run:
            Linux/macOS:  ./run.sh
            Windows:      run.bat

          The launcher exports OpenList__DistDir=../frontend/dist (relative to app/) so the
          server finds the SPA without editing appsettings.json. Default port: http://0.0.0.0:5244

          Data is stored under app/data/ by default. Configure via OpenList__ environment
          variables (e.g. OpenList__Database__Type=postgres).
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openlist-net-${{ needs.resolve-version.outputs.semver }}-${{ matrix.rid }}
          path: openlist-net-${{ needs.resolve-version.outputs.semver }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  # Publish all binary archives to the GitHub Release for the pushed tag.
  release:
    needs: [resolve-frontend, resolve-version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: openlist-net-*
          merge-multiple: false

      - name: Flatten artifacts for upload
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: ${{ github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          body: |
            ## Version
            ${{ needs.resolve-version.outputs.semver }} (sha ${{ needs.resolve-version.outputs.sha }})

            ## Frontend
            Bundled upstream non-lite OpenList-Frontend: `${{ needs.resolve-frontend.outputs.tag }}`
            (fetched from https://github.com/OpenListTeam/OpenList-Frontend/releases)
          files: release-assets/*

  # Multi-arch Docker image (amd64 + arm64) tagged with the release version + latest.
  docker:
    needs: [resolve-frontend, resolve-version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRONTEND_VERSION=${{ needs.resolve-frontend.outputs.tag }}
            VERSION=${{ needs.resolve-version.outputs.semver }}
            ASSEMBLY_VERSION=${{ needs.resolve-version.outputs.assemblyVer }}
            FILE_VERSION=${{ needs.resolve-version.outputs.fileVer }}
            INFORMATIONAL_VERSION=${{ needs.resolve-version.outputs.infoVer }}
            SOURCE_REVISION_ID=${{ needs.resolve-version.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openlist-net:${{ needs.resolve-version.outputs.semver }}
            ghcr.io/${{ github.repository_owner }}/openlist-net:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
