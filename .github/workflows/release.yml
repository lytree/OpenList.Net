name: Release

# Pushing a v* tag cuts a formal release: 8 self-contained platform bundles,
# 6 desktop bundles, a multi-arch container image, and a GitHub Release with
# generated notes.
#
# The actual platform build is delegated to build-bundles.yml — the same reusable
# workflow ci.yml runs on every main-branch commit. CI produces artifacts only;
# this file is the ONLY place that writes to GitHub Releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.2.3). The commit it points at is what gets built.'
        required: true
        type: string

# Releases must never be cancelled halfway or run concurrently — a partial
# upload would leave the GitHub Release missing assets.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# `github.ref_name` is the tag on a tag push, but the *branch* on a manual
# dispatch — so dispatch input takes priority. (The previous revision used
# `github.ref_name || inputs.tag`, which meant a manual run silently targeted
# the branch name instead of the tag the user typed.)
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semver }}
      fullSemVer: ${{ steps.gv.outputs.fullSemVer }}
      assemblyVer: ${{ steps.gv.outputs.assemblyVer }}
      fileVer: ${{ steps.gv.outputs.fileVer }}
      infoVer: ${{ steps.gv.outputs.infoVer }}
      sha: ${{ steps.gv.outputs.sha }}
      shortSha: ${{ steps.gv.outputs.shortSha }}
      majorMinor: ${{ steps.gv.outputs.majorMinor }}
    steps:
      # Check out the exact tag being released (not the triggering branch) so a
      # manual dispatch cannot publish a different commit than the tag points at.
      # fetch-depth: 0 is REQUIRED for GitVersion to resolve the clean tag version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - id: gv
        uses: ./.github/actions/resolve-version

  # Gate: never publish a tag whose commit does not build or pass tests.
  build-test:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OpenList.slnx
      - name: Build
        run: |
          dotnet build OpenList.slnx -c "$CONFIGURATION" --no-restore \
            -p:Version="${{ needs.resolve-version.outputs.semver }}" \
            -p:AssemblyVersion="${{ needs.resolve-version.outputs.assemblyVer }}" \
            -p:FileVersion="${{ needs.resolve-version.outputs.fileVer }}" \
            -p:InformationalVersion="${{ needs.resolve-version.outputs.infoVer }}" \
            -p:SourceRevisionId="${{ needs.resolve-version.outputs.sha }}"
      - name: Test
        # MTP mode (opt-in via global.json) — `--logger` is a VSTest option and is
        # rejected here; TRX output comes from `--report-trx` instead.
        run: dotnet test --solution OpenList.slnx -c "$CONFIGURATION" --no-build --report-trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  # 8 self-contained server bundles + 6 desktop bundles (matrix lives in the
  # reusable workflow, shared with ci.yml).
  bundles:
    needs: [resolve-version, build-test]
    uses: ./.github/workflows/build-bundles.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      semver: ${{ needs.resolve-version.outputs.semver }}
      assembly-ver: ${{ needs.resolve-version.outputs.assemblyVer }}
      file-ver: ${{ needs.resolve-version.outputs.fileVer }}
      info-ver: ${{ needs.resolve-version.outputs.infoVer }}
      sha: ${{ needs.resolve-version.outputs.sha }}
      # Only has to survive until the release job below has uploaded the assets.
      retention-days: 7

  # Attach every binary archive (plus checksums) to the GitHub Release.
  release:
    needs: [resolve-version, bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: openlist-net-*
          merge-multiple: false

      - name: Flatten artifacts for upload
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Pre-release tags (v0.2.0-beta.1, v1.0.0-rc.1, ...) must never become
          # the repo's "Latest": /releases/latest redirects there and users who
          # just grab the newest version would land on a beta. Anything without
          # a hyphen (v1.2.3) is a stable release and keeps Latest.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          files: release-assets/*
          body: |
            ## Version
            `${{ needs.resolve-version.outputs.semver }}` (sha `${{ needs.resolve-version.outputs.shortSha }}`)

            ## Frontend
            Built from this repository (`frontend/`, Vue 3 + TSX + Element Plus) as part of
            this release — the bundle and the API it ships with always come from the same commit.

            ## Downloads
            Headless server, self-contained builds for Linux (glibc / musl),
            Windows and macOS (amd64 + arm64) — no .NET runtime required. Each bundle also
            ships `cli/openlist`, an ops CLI for password recovery and storage admin; it
            talks to the database directly and works when the server is not running
            (`openlist admin random` resets a locked-out admin password).
            Desktop control app (Server + GUI) bundles for Linux (glibc), Windows and macOS
            (amd64 + arm64). A `.sha256` checksum accompanies each asset.

            ## Docker
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/openlist-net:${{ needs.resolve-version.outputs.semver }}
            ```

  # Multi-arch container image (amd64 + arm64). Unlike ci.yml's `:edge`, this
  # workflow owns `:latest` — it always means "newest formal release".
  docker:
    needs: [resolve-version, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openlist-net" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.semver }}
            ASSEMBLY_VERSION=${{ needs.resolve-version.outputs.assemblyVer }}
            FILE_VERSION=${{ needs.resolve-version.outputs.fileVer }}
            INFORMATIONAL_VERSION=${{ needs.resolve-version.outputs.infoVer }}
            SOURCE_REVISION_ID=${{ needs.resolve-version.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.resolve-version.outputs.semver }}
            ${{ env.IMAGE }}:${{ needs.resolve-version.outputs.majorMinor }}
          # Separate cache scope from ci.yml (shared gha backend).
          cache-from: type=gha,scope=release-docker
          cache-to: type=gha,scope=release-docker,mode=max
