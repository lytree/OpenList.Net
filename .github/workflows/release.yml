name: Release

# Pushing a v* tag cuts a formal release: 8 self-contained platform bundles,
# a multi-arch container image, and a GitHub Release with generated notes.
# For dry runs on a commit, use ci.yml's build artifacts instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.2.3). The commit it points at is what gets built.'
        required: true
        type: string

# Releases must never be cancelled halfway or run concurrently — a partial
# upload would leave the GitHub Release missing assets.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# `github.ref_name` is the tag on a tag push, but the *branch* on a manual
# dispatch — so dispatch input takes priority. (The previous revision used
# `github.ref_name || inputs.tag`, which meant a manual run silently targeted
# the branch name instead of the tag the user typed.)
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CONFIGURATION: Release
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semver }}
      fullSemVer: ${{ steps.gv.outputs.fullSemVer }}
      assemblyVer: ${{ steps.gv.outputs.assemblyVer }}
      fileVer: ${{ steps.gv.outputs.fileVer }}
      infoVer: ${{ steps.gv.outputs.infoVer }}
      sha: ${{ steps.gv.outputs.sha }}
      shortSha: ${{ steps.gv.outputs.shortSha }}
      majorMinor: ${{ steps.gv.outputs.majorMinor }}
    steps:
      # Check out the exact tag being released (not the triggering branch) so a
      # manual dispatch cannot publish a different commit than the tag points at.
      # fetch-depth: 0 is REQUIRED for GitVersion to resolve the clean tag version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - id: gv
        uses: ./.github/actions/resolve-version

  resolve-frontend:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo OpenListTeam/OpenList-Frontend --json tagName -q .tagName)"
          echo "Resolved frontend tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Gate: never publish a tag whose commit does not build or pass tests.
  build-test:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OpenList.slnx
      - name: Build
        run: |
          dotnet build OpenList.slnx -c "$CONFIGURATION" --no-restore \
            -p:Version="${{ needs.resolve-version.outputs.semver }}" \
            -p:AssemblyVersion="${{ needs.resolve-version.outputs.assemblyVer }}" \
            -p:FileVersion="${{ needs.resolve-version.outputs.fileVer }}" \
            -p:InformationalVersion="${{ needs.resolve-version.outputs.infoVer }}" \
            -p:SourceRevisionId="${{ needs.resolve-version.outputs.sha }}"
      - name: Test
        # MTP mode (opt-in via global.json) — `--logger` is a VSTest option and is
        # rejected here; TRX output comes from `--report-trx` instead.
        run: dotnet test --solution OpenList.slnx -c "$CONFIGURATION" --no-build --report-trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  # Self-contained single-file binaries for 8 runtime identifiers.
  # Bundle name is version-suffixed, e.g. openlist-net-1.2.3-linux-x64.
  binaries:
    needs: [resolve-frontend, resolve-version, build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: linux-musl-x64
            archive: tar.gz
          - rid: linux-musl-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    env:
      SEMVER: ${{ needs.resolve-version.outputs.semver }}
      ASM_VER: ${{ needs.resolve-version.outputs.assemblyVer }}
      FILE_VER: ${{ needs.resolve-version.outputs.fileVer }}
      INFO_VER: ${{ needs.resolve-version.outputs.infoVer }}
      SHA: ${{ needs.resolve-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server (self-contained single-file)
        run: |
          set -euo pipefail
          BUNDLE="openlist-net-${SEMVER}-${{ matrix.rid }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/app" \
            -r "${{ matrix.rid }}" \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"
          {
            echo "semver=$SEMVER"
            echo "assemblyVer=$ASM_VER"
            echo "fileVer=$FILE_VER"
            echo "informationalVer=$INFO_VER"
            echo "sha=$SHA"
          } > "$BUNDLE/app/VERSION"

      - name: Download upstream frontend dist (non-lite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p fe "$BUNDLE/frontend/dist"
          gh release download "$FE_TAG" --repo OpenListTeam/OpenList-Frontend \
            --pattern "openlist-frontend-dist-${FE_TAG}.tar.gz" --dir fe
          tar -xzf "fe/openlist-frontend-dist-${FE_TAG}.tar.gz" -C "$BUNDLE/frontend/dist"
          printf '%s' "$FE_TAG" > "$BUNDLE/frontend/dist/VERSION"

      - name: Write launchers and README
        env:
          RID: ${{ matrix.rid }}
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$BUNDLE"

          case "$RID" in
            win-*)
              cat > run.bat <<'EOF'
          @echo off
          cd /d "%~dp0app"
          set OpenList__DistDir=../frontend/dist
          OpenList.Server.exe
          EOF
              ;;
            *)
              cat > run.sh <<'EOF'
          #!/usr/bin/env sh
          cd "$(dirname "$0")/app" || exit 1
          export OpenList__DistDir="../frontend/dist"
          exec ./OpenList.Server
          EOF
              chmod +x run.sh
              ;;
          esac

          cat > README.txt <<EOF
          $BUNDLE
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: $FE_TAG

          Self-contained single-file build — no .NET runtime required on the host.

          Layout:
            app/             .NET server (self-contained single-file executable)
            frontend/dist/   OpenList SPA (pre-built, upstream non-lite release)
            run.sh / run.bat Launcher that sets OpenList__DistDir and starts the server
            README.txt       This file

          Run:
            Linux/macOS:  ./run.sh
            Windows:      run.bat

          The launcher exports OpenList__DistDir=../frontend/dist (relative to app/) so the
          server finds the SPA without editing appsettings.json. Default port: http://0.0.0.0:5244

          Data is stored under app/data/ by default. Configure via OpenList__ environment
          variables (e.g. OpenList__Database__Type=postgres).
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
            FILE="$BUNDLE.zip"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
            FILE="$BUNDLE.tar.gz"
          fi
          # Publish a checksum alongside every asset so downloads are verifiable.
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: |
            ${{ env.BUNDLE }}.${{ matrix.archive }}
            ${{ env.BUNDLE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Desktop control app (Avalonia GUI managing the server as a child process).
  # One bundle per GUI-capable RID: desktop exe at the bundle root, single-file
  # server under server/ (probed by OpenListCoreService.ResolveCorePath),
  # frontend/dist alongside (injected as OpenList__DistDir at launch).
  # No musl RIDs — the GUI targets glibc desktops.
  binaries-desktop:
    needs: [resolve-frontend, resolve-version, build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    env:
      SEMVER: ${{ needs.resolve-version.outputs.semver }}
      ASM_VER: ${{ needs.resolve-version.outputs.assemblyVer }}
      FILE_VER: ${{ needs.resolve-version.outputs.fileVer }}
      INFO_VER: ${{ needs.resolve-version.outputs.infoVer }}
      SHA: ${{ needs.resolve-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server core (self-contained single-file)
        run: |
          set -euo pipefail
          BUNDLE="openlist-net-desktop-${SEMVER}-${{ matrix.rid }}"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          dotnet publish src/OpenList.Server/OpenList.Server.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE/server" \
            -r "${{ matrix.rid }}" \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"

      - name: Publish desktop app (self-contained single-file)
        run: |
          set -euo pipefail
          dotnet publish src/OpenList.Desktop/OpenList.Desktop.csproj \
            -c "$CONFIGURATION" \
            -o "$BUNDLE" \
            -r "${{ matrix.rid }}" \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$SEMVER" \
            -p:AssemblyVersion="$ASM_VER" \
            -p:FileVersion="$FILE_VER" \
            -p:InformationalVersion="$INFO_VER" \
            -p:SourceRevisionId="$SHA"
          {
            echo "semver=$SEMVER"
            echo "assemblyVer=$ASM_VER"
            echo "fileVer=$FILE_VER"
            echo "informationalVer=$INFO_VER"
            echo "sha=$SHA"
          } > "$BUNDLE/VERSION"

      - name: Download upstream frontend dist (non-lite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p fe "$BUNDLE/frontend/dist"
          gh release download "$FE_TAG" --repo OpenListTeam/OpenList-Frontend \
            --pattern "openlist-frontend-dist-${FE_TAG}.tar.gz" --dir fe
          tar -xzf "fe/openlist-frontend-dist-${FE_TAG}.tar.gz" -C "$BUNDLE/frontend/dist"
          printf '%s' "$FE_TAG" > "$BUNDLE/frontend/dist/VERSION"

      - name: Write README
        env:
          BUNDLE_NAME: ${{ env.BUNDLE }}
          FE_TAG: ${{ needs.resolve-frontend.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "$BUNDLE/README.txt" <<EOF
          $BUNDLE_NAME
          =========================

          Build: $SEMVER (sha $SHA)
          Frontend: $FE_TAG

          Self-contained single-file build — no .NET runtime required on the host.

          Layout:
            OpenList.Desktop[.exe]  Avalonia desktop control app (start this)
            server/OpenList.Server  Self-contained single-file server (managed child process)
            frontend/dist/          OpenList SPA (pre-built, upstream non-lite release)
            README.txt              This file

          Run:
            Start OpenList.Desktop (double-click on Windows). The desktop app launches the
            server automatically (port configurable in settings), shows a tray icon and a
            live log viewer. Data is stored under data/ next to the desktop executable.

          The desktop app injects OpenList__DistDir so the server serves frontend/dist on
          the same port as the API. Default port: http://0.0.0.0:5244.

          Note (macOS/Linux): the desktop app is not wrapped in an .app/.desktop bundle —
          run it directly from this directory.
          EOF

      - name: Package bundle
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          if [ "$ARCHIVE" = "zip" ]; then
            zip -r "$BUNDLE.zip" "$BUNDLE"
            FILE="$BUNDLE.zip"
          else
            tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
            FILE="$BUNDLE.tar.gz"
          fi
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: |
            ${{ env.BUNDLE }}.${{ matrix.archive }}
            ${{ env.BUNDLE }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # Attach every binary archive (plus checksums) to the GitHub Release.
  release:
    needs: [resolve-frontend, resolve-version, binaries, binaries-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: openlist-net-*
          merge-multiple: false

      - name: Flatten artifacts for upload
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## Version
            `${{ needs.resolve-version.outputs.semver }}` (sha `${{ needs.resolve-version.outputs.shortSha }}`)

            ## Bundled frontend
            Upstream non-lite OpenList-Frontend `${{ needs.resolve-frontend.outputs.tag }}`
            (fetched from https://github.com/OpenListTeam/OpenList-Frontend/releases)

            ## Downloads
            Headless server, self-contained single-file builds for Linux (glibc / musl),
            Windows and macOS (amd64 + arm64) — no .NET runtime required. Desktop control
            app (Server + GUI) bundles for Linux (glibc), Windows and macOS (amd64 + arm64).
            A `.sha256` checksum accompanies each asset.

            ## Docker
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/openlist-net:${{ needs.resolve-version.outputs.semver }}
            ```

  # Multi-arch container image (amd64 + arm64). Unlike ci.yml's `:edge`, this
  # workflow owns `:latest` — it always means "newest formal release".
  docker:
    needs: [resolve-frontend, resolve-version, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openlist-net" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRONTEND_VERSION=${{ needs.resolve-frontend.outputs.tag }}
            VERSION=${{ needs.resolve-version.outputs.semver }}
            ASSEMBLY_VERSION=${{ needs.resolve-version.outputs.assemblyVer }}
            FILE_VERSION=${{ needs.resolve-version.outputs.fileVer }}
            INFORMATIONAL_VERSION=${{ needs.resolve-version.outputs.infoVer }}
            SOURCE_REVISION_ID=${{ needs.resolve-version.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.resolve-version.outputs.semver }}
            ${{ env.IMAGE }}:${{ needs.resolve-version.outputs.majorMinor }}
          # Separate cache scope from ci.yml (shared gha backend).
          cache-from: type=gha,scope=release-docker
          cache-to: type=gha,scope=release-docker,mode=max
